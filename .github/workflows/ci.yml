name: Pipeline CI/CD

on:
  push:
    branches: [ "main", "NBN" ]
  pull_request:
    branches: [ "main", "NBN" ]

jobs:
  test:
    name: Intégration Continue (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 --max-line-length=120 core/ strategies/ observers/ repositories/ api/

      - name: Tests unitaires + couverture
        run: pytest --cov=core --cov=strategies --cov-report=term

      - name: Build image Docker locale
        run: docker build -t hcy-engine:${{ github.sha }} .

  deploy:
    name: Déploiement Continu (CD)
    needs: test
    if: github.ref == 'refs/heads/NBN' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push de l'image Docker vers GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/hcy-engine:latest
            ghcr.io/${{ github.repository }}/hcy-engine:${{ github.sha }}