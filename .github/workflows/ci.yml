name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Accélère l'installation des paquets lors des futurs commits
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (flake8)
    run: flake8 --max-line-length=120 core/ strategies/ observers/ repositories/ api/
      - name: Tests unitaires + couverture
        run: pytest --cov=core --cov=strategies --cov-report=term
      - name: Build image Docker
        run: docker build -t hcy-engine:${{ github.sha }} .